[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "esxi-mcp"
version = "0.1.0"
description = "MCP server for VMware ESXi 6.7 host management"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "pyVmomi>=8.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
esxi-mcp = "esxi_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
